<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DailyLeng</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f5f7;--surface:#ffffff;--text:#1d1d1f;--text2:#6e6e73;
  --accent:#0071e3;--border:#d2d2d7;--good:#34c759;--bad:#ff3b30;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1c1c1e;--text:#f5f5f7;--text2:#98989d;
    --accent:#0a84ff;--border:#38383a;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--text:#f5f5f7;--text2:#98989d;
  --accent:#0a84ff;--border:#38383a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;
  height:env(safe-area-inset-top,0px);background:var(--surface);z-index:20;
}
header{
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);
  border-bottom:1px solid var(--border);z-index:10;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;}
.langs{display:flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px;}
.langs button{border:none;background:transparent;padding:6px 13px;border-radius:7px;
  font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s;font-family:inherit;}
.langs button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);}
nav{max-width:680px;margin:0 auto;display:flex;gap:6px;padding:16px 20px 0;overflow-x:auto;}
nav button{background:var(--surface);padding:9px 15px;border-radius:18px;
  font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;
  transition:.15s;border:1px solid var(--border);font-family:inherit;}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{max-width:680px;margin:0 auto;padding:16px 20px 40px;}
.list{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.row-main{min-width:0;flex:1;}
.word{font-size:16px;font-weight:600;}
.pron{color:var(--accent);font-size:12px;font-weight:500;}
.tr{color:var(--text2);font-size:14px;margin-top:2px;}
.tag{font-size:12px;color:var(--text2);flex-shrink:0;padding-top:2px;}
.count{font-size:13px;color:var(--text2);margin-bottom:10px;}
input[type=search]{
  width:100%;padding:11px 15px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;
}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:26px 22px;text-align:center;}
.quiz-q{font-size:19px;font-weight:600;margin-bottom:20px;line-height:1.4;}
.opt{display:block;width:100%;padding:13px;margin-bottom:9px;border-radius:11px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;
  cursor:pointer;text-align:left;transition:.15s;font-family:inherit;}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:var(--good);color:#fff;border-color:var(--good);}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad);}
.score{font-size:13px;color:var(--text2);margin-bottom:12px;text-align:center;}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 26px;
  border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;font-family:inherit;}
.empty{text-align:center;color:var(--text2);padding:40px 20px;font-size:14px;}
:root{--glass:rgba(255,255,255,.72);--accent2:#5e5ce6;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);--ease:cubic-bezier(.22,1,.36,1);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(28,28,30,.72);--accent2:#bf5af2;--shadow:0 10px 30px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{--glass:rgba(28,28,30,.72);--accent2:#bf5af2;--shadow:0 10px 30px rgba(0,0,0,.55);}
body{background-image:radial-gradient(60% 40% at 8% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(50% 35% at 100% 0%,color-mix(in srgb,var(--accent2) 13%,transparent),transparent);background-attachment:fixed;}
body::before,header{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);}
header{border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);}
h1{font-size:23px;font-weight:700;letter-spacing:-.025em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.langs{position:relative;border-radius:11px;}
.langs .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.08);}
.langs.ready .thumb{transition:transform .5s cubic-bezier(.34,1.3,.5,1),width .5s var(--ease);}
.langs button{position:relative;z-index:1;border-radius:8px;}
.langs button.active{background:transparent;box-shadow:none;color:var(--text);}
nav button{transition:background .3s var(--ease),color .3s var(--ease),transform .2s var(--ease),box-shadow .3s;border-color:color-mix(in srgb,var(--border) 70%,transparent);}
nav button.active{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 38%,transparent);}
nav button:active,.btn:active,.opt:active{transform:scale(.96);}
.list,.quiz-card{border-color:color-mix(in srgb,var(--border) 60%,transparent);box-shadow:var(--shadow);}
.list{border-radius:18px;}
.quiz-card{border-radius:24px;padding:30px 22px;}
.row{transition:background .25s;}
@media (hover:hover){.row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent);}.opt:hover{transform:translateY(-1px);}}
.row.in{animation:rise .55s var(--ease) both;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}}
input[type=search]{border-radius:14px;transition:box-shadow .3s var(--ease),border-color .3s;}
input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);}
.opt{border-radius:14px;padding:15px;transition:transform .25s var(--ease),background .3s,border-color .3s,color .3s;}
.opt:nth-of-type(1),.opt:nth-of-type(2),.opt:nth-of-type(3),.opt:nth-of-type(4){animation:rise .5s var(--ease) both;}
.opt:nth-of-type(2){animation-delay:.06s;}.opt:nth-of-type(3){animation-delay:.12s;}.opt:nth-of-type(4){animation-delay:.18s;}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .25s var(--ease);}
.prog{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-bottom:12px;}
.prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .7s var(--ease);}
.ring{position:relative;width:140px;height:140px;margin:6px auto 16px;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round;}
.ring .trk{stroke:var(--border);}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset 1.3s var(--ease);}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;letter-spacing:-.02em;}
.langs{max-width:100%;overflow-x:auto;scrollbar-width:none;}.langs::-webkit-scrollbar{display:none;}.langs button{white-space:nowrap;}
.spk{flex-shrink:0;align-self:center;border:none;background:color-mix(in srgb,var(--accent) 12%,transparent);width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer;margin-left:8px;transition:transform .25s var(--ease),background .3s;}
.spk:active{transform:scale(.86);}
.spk.on{background:var(--accent);animation:pulse .9s ease-in-out infinite;}
@keyframes pulse{50%{transform:scale(1.14);}}
.ex{margin-top:7px;padding:8px 11px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:13px;line-height:1.45;}
.ex span{opacity:.65;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<header>
  <h1>DailyLeng</h1>
  <div class="langs" id="langs"></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>(function(){var k=["fr","ru","en","de","it","pt"],l="fr";try{var s=localStorage.getItem("dl_lang");if(k.indexOf(s)>-1)l=s}catch(e){}window.__L0=l;window.__DV="23";document.write('<script src="data/'+l+'.js?v=23" onerror="window.__LDERR=1"><\/script>');})();</script>
<script>
const DATA={fr:{name:"Francés",flag:"🇫🇷",tts:"fr-FR",dic:[],phr:[],key:[],ex:""},ru:{name:"Ruso",flag:"🇷🇺",tts:"ru-RU",dic:[],phr:[],key:[],ex:""},en:{name:"Inglés",flag:"🇬🇧",tts:"en-US",dic:[],phr:[],key:[],ex:""},de:{name:"Alemán",flag:"🇩🇪",tts:"de-DE",dic:[],phr:[],key:[],ex:""},it:{name:"Italiano",flag:"🇮🇹",tts:"it-IT",dic:[],phr:[],key:[],ex:""},pt:{name:"Portugués",flag:"🇵🇹",tts:"pt-PT",dic:[],phr:[],key:[],ex:""}};
for(const l in DATA)useLang(l);

let state={lang:window.__L0||"fr",tab:"dic",qi:0,score:0,questions:[]};
let answered=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderLangs(){
  document.getElementById("langs").innerHTML=Object.keys(DATA).map(k=>
    `<button class="${k===state.lang?"active":""}" onclick="setLang('${k}')">${DATA[k].flag} ${DATA[k].name}</button>`
  ).join("");
}
function setLang(l){
  state.lang=l;state.qi=0;state.score=0;state.questions=[];
  renderLangs();render();
}
function renderTabs(){
  const tabs=[["dic","Diccionario"],["phr","Frases"],["key","Palabras clave"],["quiz","Test"]];
  document.getElementById("tabs").innerHTML=tabs.map(t=>
    `<button class="${t[0]===state.tab?"active":""}" onclick="setTab('${t[0]}')">${t[1]}</button>`
  ).join("");
}
function setTab(t){
  state.tab=t;
  if(t==="quiz"){state.qi=0;state.score=0;state.questions=genQuiz(20);}
  renderTabs();render();
}
function rowWord(e){
  return `<div class="row"><div class="row-main"><div><span class="word">${e.w}</span> <span class="pron">${e.p}</span></div><div class="tr">${e.t}</div></div><div class="tag">${e.c}</div></div>`;
}
function render(){
  const d=DATA[state.lang];
  const main=document.getElementById("main");
  if(state.tab==="dic"){
    main.innerHTML=`<input type="search" placeholder="Buscar palabra..." oninput="filterDicD(this.value)">`+
      `<div class="count">${d.dic.length} palabras</div>`+
      `<div class="list" id="diclist">`+d.dic.map(rowWord).join("")+`</div>`;
  } else if(state.tab==="phr"){
    main.innerHTML=`<div class="count">${d.phr.length} frases</div><div class="list">`+d.phr.map(p=>
      `<div class="row"><div class="row-main"><div class="word">${p.f}</div><div class="tr">${p.t}</div></div></div>`
    ).join("")+`</div>`;
  } else if(state.tab==="key"){
    main.innerHTML=`<div class="count">${d.key.length} palabras clave</div><div class="list">`+d.key.map(w=>{
      const e=d.dic.find(x=>x.w===w);
      return `<div class="row"><div class="row-main"><div><span class="word">${w}</span>`+(e?` <span class="pron">${e.p}</span>`:"")+`</div>`+(e?`<div class="tr">${e.t}</div>`:"")+`</div></div>`;
    }).join("")+`</div>`;
  } else {
    renderQuiz();
  }
}
function filterDic(v){
  const d=DATA[state.lang];
  v=v.toLowerCase();
  const f=d.dic.filter(e=>e.w.toLowerCase().includes(v)||e.t.toLowerCase().includes(v));
  document.getElementById("diclist").outerHTML=f.length?
    `<div class="list" id="diclist">`+f.map(rowWord).join("")+`</div>`:
    `<div class="empty" id="diclist">Sin resultados</div>`;
}
function genQuiz(n){
  const lang=DATA[state.lang];
  const d=lang.dic;
  n=Math.min(n,d.length);
  const idxPool=shuffle(d.map((_,i)=>i)).slice(0,n);
  return idxPool.map(idx=>{
    const entry=d[idx];
    const reverse=Math.random()<0.5;
    const correctText=reverse?entry.w:entry.t;
    const promptText=reverse?`¿Cómo se dice "${entry.t}" en ${lang.name.toLowerCase()}?`:`¿Qué significa "${entry.w}"?`;
    const candidates=d.filter((e,i)=>i!==idx&&(reverse?e.w:e.t)!==correctText);
    const distractors=shuffle(candidates).slice(0,3).map(e=>reverse?e.w:e.t);
    const opts=shuffle([correctText,...distractors]);
    return {q:promptText,o:opts,a:opts.indexOf(correctText)};
  });
}
function renderQuiz(){
  const main=document.getElementById("main");
  if(!state.questions.length) state.questions=genQuiz(20);
  if(state.qi>=state.questions.length){
    let best=state.score;
    try{
      const raw=localStorage.getItem("best_"+state.lang);
      const saved=raw===null?-1:parseInt(raw);
      if(state.score>saved) localStorage.setItem("best_"+state.lang,state.score);
      best=parseInt(localStorage.getItem("best_"+state.lang));
    }catch(e){}
    main.innerHTML=`<div class="quiz-card"><div class="quiz-q">Test completado</div>`+
      `<div class="score">Has acertado ${state.score} de ${state.questions.length} preguntas<br>Mejor puntuación: ${best}</div>`+
      `<button class="btn" onclick="setTab('quiz')">Nuevo test</button></div>`;
    return;
  }
  const q=state.questions[state.qi];
  main.innerHTML=`<div class="score">Pregunta ${state.qi+1} de ${state.questions.length}</div>`+
    `<div class="quiz-card"><div class="quiz-q">${q.q}</div>`+
    q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i},${q.a})">${o}</button>`).join("")+
    `</div>`;
  answered=false;
}
function answer(i,correct){
  if(answered) return;
  answered=true;
  document.getElementById("opt"+correct).classList.add("correct");
  if(i!==correct) document.getElementById("opt"+i).classList.add("wrong");
  else state.score++;
  setTimeout(()=>{state.qi++;renderQuiz();},900);
}

const motion=!matchMedia("(prefers-reduced-motion:reduce)").matches;
const anim=(el,kf,o)=>motion&&el&&el.animate(kf,Object.assign({easing:"cubic-bezier(.22,1,.36,1)"},o));
function renderLangs(){
  const el=document.getElementById("langs");
  if(!el.firstChild){
    el.innerHTML='<i class="thumb"></i>'+Object.keys(DATA).map(k=>`<button data-k="${k}" onclick="setLang('${k}')">${DATA[k].flag} ${DATA[k].name}</button>`).join("");
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("ready")));
  }
  el.querySelectorAll("button").forEach(b=>{
    const on=b.dataset.k===state.lang;b.classList.toggle("active",on);
    if(on){const t=el.querySelector(".thumb");t.style.width=b.offsetWidth+"px";t.style.transform=`translateX(${b.offsetLeft-3}px)`;el.scrollTo({left:b.offsetLeft-el.clientWidth/2+b.offsetWidth/2,behavior:motion?"smooth":"auto"});}
  });
}
function renderTabs(){
  const n=document.getElementById("tabs");
  if(!n.firstChild){
    n.innerHTML=[["dic","Diccionario"],["phr","Frases"],["key","Palabras clave"],["num","Números"],["pro","Pronunciación"],["fav","★ Favs"],["quiz","Test"]].map(t=>`<button data-t="${t[0]}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("");
  }
  n.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.t===state.tab));
}
function stagger(){document.querySelectorAll("#main .row").forEach((r,i)=>{if(i<16){r.classList.add("in");r.style.animationDelay=i*26+"ms";}});decorate();}
function decorate(){
  const d=DATA[state.lang];
  const ex=d.exm||(d.exm=Object.fromEntries((d.ex||"").split(";").filter(Boolean).map(x=>{const[w,f,t]=x.split("|");return[w,{f,t}];})));
  document.querySelectorAll("#main .row").forEach(r=>{
    const w=r.querySelector(".word");if(!w||r.querySelector(".spk"))return;
    const e=state.tab==="key"&&ex[w.textContent.trim()];
    if(e)(w.parentElement||r).insertAdjacentHTML("beforeend",`<div class="ex">${e.f}<br><span>${e.t}</span></div>`);
    const b=document.createElement("button");b.className="spk";b.setAttribute("aria-label","Escuchar");b.textContent="🔊";
    b.onclick=()=>speak(w.textContent.trim(),b);r.appendChild(b);
  });
}
function speak(t,b){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  document.querySelectorAll(".spk.on").forEach(x=>x.classList.remove("on"));
  const u=new SpeechSynthesisUtterance(t);u.lang=DATA[state.lang].tts;u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>x.lang.replace("_","-").toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));if(v)u.voice=v;
  b.classList.add("on");u.onend=u.onerror=()=>b.classList.remove("on");speechSynthesis.speak(u);
}
function countUp(n){
  const el=document.getElementById("num");
  if(!motion||!n){el.textContent=n;return;}
  const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);})(t0);
}
const _r=render,_f=filterDic;
render=function(){
  const m=document.getElementById("main");m.getAnimations().forEach(a=>a.cancel());
  _r();anim(m,[{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:480});stagger();
};
filterDic=function(v){_f(v);stagger();};
function renderQuiz(){
  const main=document.getElementById("main");
  main.getAnimations().forEach(a=>a.cancel());
  if(!state.questions.length) state.questions=genQuiz(20);
  const N=state.questions.length;
  if(state.qi>=N){
    let best=state.score;
    try{
      const raw=localStorage.getItem("best_"+state.lang);
      const saved=raw===null?-1:parseInt(raw);
      if(state.score>saved) localStorage.setItem("best_"+state.lang,state.score);
      best=parseInt(localStorage.getItem("best_"+state.lang));
    }catch(e){}
    const C=2*Math.PI*54;
    main.innerHTML=`<div class="quiz-card"><div class="quiz-q">Test completado</div><div class="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="54"/><circle class="bar" cx="60" cy="60" r="54" style="stroke-dasharray:${C};stroke-dashoffset:${C}" data-off="${C*(1-state.score/N)}"/></svg><b id="num">0</b></div><div class="score">Has acertado ${state.score} de ${N} preguntas<br>Mejor puntuación: ${best}</div><button class="btn" onclick="setTab('quiz')">Nuevo test</button></div>`;
    anim(main,[{opacity:0,transform:"scale(.97)"},{opacity:1,transform:"none"}],{duration:480});
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=main.querySelector(".bar");if(!b)return;b.style.strokeDashoffset=b.dataset.off;countUp(state.score);}));
    return;
  }
  const q=state.questions[state.qi];
  main.innerHTML=`<div class="prog"><i style="width:${state.qi/N*100}%"></i></div><div class="score">Pregunta ${state.qi+1} de ${N}</div><div class="quiz-card"><div class="quiz-q">${q.q}</div>`+
    q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i},${q.a})">${o}</button>`).join("")+`</div>`;
  anim(main,[{opacity:0,transform:"translateX(18px)"},{opacity:1,transform:"none"}],{duration:420});
  answered=false;
}
function answer(i,correct){
  if(answered) return;
  answered=true;
  const ok=document.getElementById("opt"+correct),sel=document.getElementById("opt"+i);
  ok.classList.add("correct");
  if(i!==correct){
    sel.classList.add("wrong");
    anim(sel,[{transform:"translateX(0)"},{transform:"translateX(-9px)"},{transform:"translateX(8px)"},{transform:"translateX(-4px)"},{transform:"none"}],{duration:400});
  } else {
    state.score++;
    anim(ok,[{transform:"scale(1)"},{transform:"scale(1.04)"},{transform:"scale(1)"}],{duration:450,easing:"cubic-bezier(.34,1.56,.64,1)"});
  }
  const p=document.querySelector(".prog i");
  if(p) p.style.width=(state.qi+1)/state.questions.length*100+"%";

function proNorm(s){return String(s).toLowerCase().replace(/\([^)]*\)/g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/ё/g,'е')

function proLev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
